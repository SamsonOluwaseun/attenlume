# Drift code generation [P0-02].
# DateTimes are stored as ISO 8601 text, UTC (BUILD_GUIDE 9.4).
targets:
  $default:
    builders:
      drift_dev:
        options:
          store_date_time_values_as_text: true
          databases:
            app_database: lib/data/local_database/app_database.dart
          schema_dir: drift_schemas/
