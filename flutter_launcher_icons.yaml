# Platform app icons from the supplied Attenlume artwork (DESIGN_GUIDE, Logo).
# Regenerate with:  dart run flutter_launcher_icons
# Then revert the tool's edits to AndroidManifest.xml (it replaces the
# Quick Settings tile icon) and ios/Runner.xcodeproj/project.pbxproj.
#
# Owner-approved cleaned artwork (P1-56): full-bleed navy for store masks,
# and rounded transparent exterior for Windows/legacy Android. Interior opaque.
# Regenerate production variants first: dart run tool/brand/prepare_icons.dart
flutter_launcher_icons:
  image_path: "assets/brand/icons/attenlume-app-icon-fullbleed.png"

  android: true
  image_path_android: "assets/brand/icons/attenlume-app-icon-filled.png"
  adaptive_icon_background: "#012331"
  adaptive_icon_foreground: "assets/brand/icons/attenlume-app-icon-fullbleed.png"
  # Keeps the whole mark inside the launcher's circular safe zone.
  adaptive_icon_foreground_inset: 23

  ios: true
  remove_alpha_ios: true

  # Multi-resolution Windows ICO is generated by prepare_icons.dart.
  windows:
    generate: false
